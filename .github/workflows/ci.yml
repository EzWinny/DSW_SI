name: CourseHub CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: courseHub_demo/backend/requirements*.txt
      - name: Install backend dependencies
        run: python -m pip install -r courseHub_demo/backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Test backend contract
        run: python -m pytest courseHub_demo/backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: courseHub_demo/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Prepare non-secret Docker env for build validation
        run: cp backend/.env.docker.example backend/.env.docker
      - name: Validate Compose
        run: docker compose config
      - name: Build images
        run: docker compose build